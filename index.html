
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#14181d">

    <title>Abfahrten</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #14181d;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .app {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            padding: 10px 5px 18px;
            border-bottom: 2px solid #ffffff;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .station-name {
            margin-top: 10px;
            color: #b7bec7;
            font-size: 16px;
        }

        .search {
            margin: 25px 0;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #4a515b;
            border-radius: 5px;
            background: #222830;
            color: white;
            font-size: 16px;
        }

        input::placeholder {
            color: #9ba3ad;
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            border: 1px solid #4a515b;
            border-radius: 5px;
            background: #303944;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
        }

        .station-result {
            text-align: left;
            background: #222830;
        }

        .departures {
            margin-top: 25px;
        }

        .departure {
            display: grid;
            grid-template-columns: 58px minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            min-height: 76px;
            padding: 12px 5px;
            border-bottom: 1px solid #343b44;
        }

        .symbol {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 42px;
            border-radius: 4px;
            background: #303944;
            color: white;
            font-size: 21px;
            font-weight: bold;
        }

        .symbol.u {
            background: #0077bd;
        }

        .symbol.s {
            background: #008b55;
        }

        .symbol.bus {
            font-size: 15px;
        }

        .route {
            margin-bottom: 5px;
            font-size: 23px;
            font-weight: bold;
        }

        .destination {
            color: #d0d5dc;
            font-size: 16px;
            line-height: 1.3;
        }

        .minutes {
            color: #ffd900;
            font-size: 24px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status {
            margin-top: 5px;
            color: #9ba3ad;
            font-size: 12px;
        }

        .message {
            padding: 20px 5px;
            color: #c1c7cf;
            font-size: 16px;
        }

        .error {
            color: #ff8a8a;
        }

        .footer {
            margin-top: 25px;
            color: #737d89;
            font-size: 12px;
            text-align: center;
        }

        .footer a {
            color: #9ba3ad;
        }

        @media (max-width: 380px) {
            body {
                padding: 12px;
            }

            h1 {
                font-size: 27px;
            }

            .departure {
                grid-template-columns: 48px minmax(0, 1fr) auto;
                gap: 8px;
            }

            .symbol {
                width: 44px;
                height: 38px;
                font-size: 18px;
            }

            .route {
                font-size: 20px;
            }

            .destination {
                font-size: 14px;
            }

            .minutes {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="app">

        <header>
            <h1>ABFAHRTEN</h1>
            <div id="stationName" class="station-name">
                Haltestelle auswählen
            </div>
        </header>

        <section class="search">
            <input
                type="text"
                id="searchInput"
                placeholder="Haltestelle suchen"
                autocomplete="off"
            >

            <button id="searchButton" onclick="searchStation()">
                Haltestelle suchen
            </button>

            <div id="searchResults"></div>
        </section>

        <section class="departures">
            <div id="departures" class="message">
                Wähle eine Haltestelle aus.
            </div>

            <div id="updateStatus" class="status"></div>
        </section>

        <div class="footer">
            Fahrplandaten von
            <a href="https://transitous.org/sources/" target="_blank">
                Transitous
            </a>
        </div>

    </div>

    <script>
        const API_URL = "https://api.transitous.org/api";

        let selectedStation = null;
        let refreshTimer = null;
        let isLoading = false;

        async function searchStation() {
            const input = document.getElementById("searchInput");
            const results = document.getElementById("searchResults");
            const button = document.getElementById("searchButton");

            const query = input.value.trim();

            if (!query) {
                results.textContent =
                    "Bitte gib einen Haltestellennamen ein.";
                return;
            }

            results.innerHTML =
                '<div class="message">Suche läuft ...</div>';

            button.disabled = true;

            try {
                const url =
                    `${API_URL}/v1/geocode` +
                    `?text=${encodeURIComponent(query)}` +
                    "&type=STOP";

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Suche fehlgeschlagen");
                }

                const data = await response.json();

                const stations = Array.isArray(data)
                    ? data
                    : data.features || data.results || [];

                results.innerHTML = "";

                if (stations.length === 0) {
                    results.innerHTML =
                        '<div class="message">Keine Haltestellen gefunden.</div>';
                    return;
                }

                stations.forEach(station => {
                    const item = station.properties || station;

                    const name =
                        item.name ||
                        item.label ||
                        "Unbekannte Haltestelle";

                    const id =
                        item.id ||
                        item.stop_id ||
                        item.stopId;

                    if (!id) return;

                    const button = document.createElement("button");
                    button.className = "station-result";
                    button.textContent = name;

                    button.onclick = () => selectStation(name, id);

                    results.appendChild(button);
                });

            } catch (error) {
                results.innerHTML =
                    '<div class="message error">Die Suche konnte nicht geladen werden.</div>';

                console.error(error);

            } finally {
                button.disabled = false;
            }
        }

        function selectStation(name, id) {
            selectedStation = { name, id };

            document.getElementById("stationName").textContent = name;
            document.getElementById("searchResults").innerHTML = "";

            if (refreshTimer !== null) {
                clearInterval(refreshTimer);
            }

            loadDepartures();

            refreshTimer = setInterval(() => {
                loadDepartures();
            }, 30000);
        }

        async function loadDepartures() {
            if (!selectedStation || isLoading) return;

            isLoading = true;

            const container = document.getElementById("departures");
            const updateStatus = document.getElementById("updateStatus");

            updateStatus.textContent = "Aktualisiere ...";

            try {
                const url =
                    `${API_URL}/v6/stoptimes` +
                    `?stopId=${encodeURIComponent(selectedStation.id)}` +
                    "&n=10";

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Abfahrten konnten nicht geladen werden");
                }

                const data = await response.json();
                const departures = data.stopTimes || [];

                container.innerHTML = "";

                if (departures.length === 0) {
                    container.innerHTML =
                        '<div class="message">Keine Abfahrten gefunden.</div>';
                    return;
                }

                departures.forEach(departure => {
                    const row = document.createElement("div");
                    row.className = "departure";

                    const line =
                        departure.displayName ||
                        departure.routeShortName ||
                        departure.route?.shortName ||
                        departure.route?.name ||
                        departure.mode ||
                        "?";

                    const destination =
                        departure.headsign ||
                        departure.trip?.headsign ||
                        departure.destination?.name ||
                        "Unbekanntes Ziel";

                    const rawTime =
                        departure.place?.departure ||
                        departure.departure ||
                        departure.predictedDeparture ||
                        departure.scheduledDeparture;

                    const date = rawTime
                        ? new Date(rawTime)
                        : null;

                    let minutes = "--";

                    if (date && !isNaN(date.getTime())) {
                        const difference =
                            Math.ceil((date.getTime() - Date.now()) / 60000);

                        minutes = difference <= 0
                            ? "Jetzt"
                            : `${difference} min`;
                    }

                    const symbol = document.createElement("div");
                    symbol.className = "symbol";

                    const lineText = String(line).toUpperCase();

                    if (lineText.startsWith("U")) {
                        symbol.classList.add("u");
                        symbol.textContent = "U";
                    } else if (lineText.startsWith("S")) {
                        symbol.classList.add("s");
                        symbol.textContent = "S";
                    } else {
                        symbol.classList.add("bus");
                        symbol.textContent = lineText.startsWith("BUS")
                            ? "BUS"
                            : "BUS";
                    }

                    const details = document.createElement("div");

                    const route = document.createElement("div");
                    route.className = "route";
                    route.textContent = line;

                    const destinationElement = document.createElement("div");
                    destinationElement.className = "destination";
                    destinationElement.textContent = destination;

                    const status = document.createElement("div");
                    status.className = "status";

                    if (departure.cancelled || departure.tripCancelled) {
                        status.textContent = "Fällt aus";
                    } else if (departure.realTime) {
                        status.textContent = "Echtzeit";
                    } else {
                        status.textContent = "Fahrplan";
                    }

                    details.appendChild(route);
                    details.appendChild(destinationElement);
                    details.appendChild(status);

                    const time = document.createElement("div");
                    time.className = "minutes";
                    time.textContent = minutes;

                    row.appendChild(symbol);
                    row.appendChild(details);
                    row.appendChild(time);

                    container.appendChild(row);
                });

                updateStatus.textContent =
                    "Zuletzt aktualisiert: " +
                    new Date().toLocaleTimeString("de-DE", {
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit"
                    });

            } catch (error) {
                container.innerHTML =
                    '<div class="message error">Abfahrten konnten nicht geladen werden.</div>';

                updateStatus.textContent = "Bitte später erneut versuchen.";

                console.error(error);

            } finally {
                isLoading = false;
            }
        }

        document.getElementById("searchInput").addEventListener(
            "keydown",
            event => {
                if (event.key === "Enter") {
                    searchStation();
                }
            }
        );
    </script>
</body>
</html>
